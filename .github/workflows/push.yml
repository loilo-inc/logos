on: push
name: CI
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - name: Check Tidy
        run: |
          go mod tidy
          git diff --exit-code
      - name: Check Format
        run: |
          make fmt
          git diff --exit-code
      - run: make test
