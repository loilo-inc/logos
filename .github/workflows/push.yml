on: push
name: CI
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
      - name: Check Tidy
        run: |
          go mod tidy
          git diff --exit-code
      - name: Check Format
        run: |
          make fmt
          git diff --exit-code
      - run: make test
